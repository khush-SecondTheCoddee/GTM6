[package]
name = "nextgen-editor-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Memory-safe native document engine for NextGen Editor"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"
once_cell = "1.20.2"
parking_lot = "0.12.3"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
thiserror = "2.0.9"
yrs = "0.24.0"
