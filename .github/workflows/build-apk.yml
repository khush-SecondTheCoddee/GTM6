name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      # Do not use android-actions/setup-android: it tries to install Google's
      # removed legacy `tools` package. ubuntu-latest has ANDROID_HOME, but does
      # not guarantee sdkmanager is preinstalled, so bootstrap cmdline-tools.
      - name: Install Android command-line tools, platform, and NDK 26
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          readonly CMDLINE_TOOLS_DIR="$ANDROID_SDK_ROOT/cmdline-tools"
          readonly SDKMANAGER="$CMDLINE_TOOLS_DIR/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            curl --fail --location --retry 3 --output /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            rm -rf "$CMDLINE_TOOLS_DIR/latest"
            mkdir -p "$CMDLINE_TOOLS_DIR"
            unzip -q /tmp/cmdline-tools.zip -d "$CMDLINE_TOOLS_DIR"
            mv "$CMDLINE_TOOLS_DIR/cmdline-tools" "$CMDLINE_TOOLS_DIR/latest"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - name: Cross-compile Rust engine
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          rm -rf app/src/main/jniLibs
          cargo ndk --manifest-path core-engine/Cargo.toml --platform 26 --target arm64-v8a --target armeabi-v7a --target x86_64 --output-dir app/src/main/jniLibs build --release
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-editor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
